name: Official apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/package-lock.json
      - id: host
        run: echo "commit=$(node -p 'require(\"./host.lock.json\").commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: myco-ai/myco
          ref: ${{ steps.host.outputs.commit }}
          path: .cache/myco
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .cache/myco/go.mod
          cache-dependency-path: .cache/myco/go.sum
      - run: npm --prefix templates ci
      - run: make check
      - run: npm --prefix templates run build
      - name: Validate with the actual Hub manifest parser
        run: scripts/check-host.sh
      - run: scripts/pack-apps.sh
      - name: Repacking is deterministic
        run: |
          cp dist/apps/SHA256SUMS "$RUNNER_TEMP/first-sums"
          scripts/pack-apps.sh
          cmp "$RUNNER_TEMP/first-sums" dist/apps/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: apps-build
          path: dist/
          retention-days: 7
  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/package-lock.json
      - id: host
        run: echo "commit=$(node -p 'require(\"./host.lock.json\").commit')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: myco-ai/myco
          ref: ${{ steps.host.outputs.commit }}
          path: .cache/myco
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: apps-build
          path: dist
      - name: Browser dependencies
        run: |
          npm --prefix templates ci
          npm --prefix .cache/myco/web ci
          npm install -g playwright@1.57.0
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Browser regression and host bridge contracts
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: 4
        run: make browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.shard }}
          path: |
            artifacts/
            templates/*-shots/
          retention-days: 7
  publish:
    needs: [check, browser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apps-build
          path: dist
      - name: Publish an immutable version and the rolling catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-apps.sh
